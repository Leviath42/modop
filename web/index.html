<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f4e9c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Modop</title>
    <script>
      // Applique le thème avant le premier rendu pour éviter tout flash (issue #2).
      (function () {
        try {
          var m = /(?:^|;\s*)modop-theme=(dark|light)(?:;|$)/.exec(document.cookie);
          var t = m ? m[1] : localStorage.getItem("modop-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app.tsx"></script>
  <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
      }
    </script>
  </body>
</html>
